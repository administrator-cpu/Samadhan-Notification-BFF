# nginx site for the Notification Service token API.
# Include from nginx.conf's http { } block, next to the samadhan-api server block:
#     include conf/sites/samadhan-notify.conf;
# Put this line ONCE in the http { } block (not inside server { }):
#     limit_req_zone $binary_remote_addr zone=notify_api:10m rate=10r/s;

server {
    listen 80;
    server_name samadhan-notify.fab5connect.com;
    # ACME HTTP-01 challenge (win-acme / certbot), then redirect everything else.
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name samadhan-notify.fab5connect.com;

    # Use the same certificate tooling as samadhan-api.fab5connect.com.
    ssl_certificate     C:/nginx/ssl/samadhan-notify.fab5connect.com-chain.pem;
    ssl_certificate_key C:/nginx/ssl/samadhan-notify.fab5connect.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:notify_ssl:10m;

    client_max_body_size 16k;
    access_log logs/samadhan-notify.access.log;
    error_log  logs/samadhan-notify.error.log warn;

    location /v1/ {
        limit_req zone=notify_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health shows queue depth: keep it to the server itself (and your uptime monitor's IP if any).
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:4100;
    }

    location / { return 404; }
}
